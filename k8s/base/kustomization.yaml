apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kokoro
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - pvc.yaml
configMapGenerator:
  - name: kokoro-settings
    literals:
      - KOKORO_DATA_DIR=/data
      - KOKORO_WORKERS=1
      - KOKORO_MPS=0
      - KOKORO_WORKSPACE_MIB=2048
      - KOKORO_MAX_TOKENS=500
      - KOKORO_MAX_FRAMES=2000
      - KOKORO_CPU_THREADS=4
      - KOKORO_CACHE_EPOCH=1
