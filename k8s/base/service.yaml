apiVersion: v1
kind: Service
metadata:
  name: kokoro
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kokoro
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: grpc
      port: 8001
      targetPort: grpc
    - name: metrics
      port: 8002
      targetPort: metrics
