apiVersion: batch/v1
kind: Job
metadata:
  name: kokoro-benchmark
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: benchmark
          image: kokoro-benchmark:local
          args:
            - --url=kokoro:8001
            - --concurrency=1,2,4,8,16,32
            - --duration=30
            - --json-stdout
            - --out=/tmp/benchmark.json
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
