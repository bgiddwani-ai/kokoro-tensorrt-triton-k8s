apiVersion: batch/v1
kind: Job
metadata:
  name: kokoro-eager
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: benchmark
          image: kokoro-benchmark:local
          args:
            - --backend=eager
            - --concurrency=1
            - --duration=30
            - --json-stdout
            - --out=/tmp/eager.json
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 16Gi
              nvidia.com/gpu: "1"
