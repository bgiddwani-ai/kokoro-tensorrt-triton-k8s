name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==1.26.4 onnx==1.18.0 onnxruntime==1.22.0 PyYAML==6.0.2 kubernetes-validate==1.32.0 ruff==0.11.2
      - run: ruff check app && ruff format --check app
      - run: bash -n app/entrypoint.sh
      - run: PYTHONPATH=app python -m unittest discover -s app/tests -v
      - run: git diff --check
